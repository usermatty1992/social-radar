name: Update trends and deploy Pages
on:
  schedule:
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'README.md', 'docs/**']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: social-radar-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify collector behavior
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Collect real data (failure retains prior data)
        id: collect
        continue-on-error: true
        env:
          ENABLE_THREADS: 'false'
        run: python scripts/update_data.py
      - name: Validate public data
        run: python scripts/validate_data.py
      - name: Commit public observations and source status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Update Taiwan trend observations'
            git push
          fi
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v4

